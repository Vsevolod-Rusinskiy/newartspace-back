name: Master CI/CD

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Security audit (non-blocking)
        run: |
          yarn audit || true

      - name: Run Prettier check
        run: yarn prettier-check

      - name: Run Lint check
        run: yarn lint

      - name: Run disk/inode preflight tests
        run: bash scripts/deploy/preflight.test.sh

      - name: Run database preflight tests
        run: bash scripts/deploy/database-preflight.test.sh

      - name: Run service readiness tests
        run: bash scripts/deploy/service-readiness.test.sh

      - name: Run locked production release tests
        run: bash scripts/deploy/production-release.test.sh

      - name: Run Jest tests
        run: yarn test --runInBand

      - name: Build backend
        run: yarn build

  build-and-push:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/vsevolod-rusinskiy/newartspace-back:sha-${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run locked production release
        uses: appleboy/ssh-action@v1.2.5
        env:
          NAS_RETENTION_MODE: dry-run
          NAS_RELEASE_LOCK_PATH: /var/lock/newartspace-deploy-cleanup.lock
          NAS_RELEASE_LOCK_WAIT_SECONDS: "300"
          NAS_RETENTION_STATE_DIR: /var/lib/newartspace/image-retention
          NAS_RETENTION_OWNER_UID: "0"
          NAS_RETENTION_LEDGER_NAME: back.successful-images
          NAS_IMAGE_REPOSITORY: ghcr.io/vsevolod-rusinskiy/newartspace-back
          NAS_DEPLOY_EXPECTED_IMAGE: ghcr.io/vsevolod-rusinskiy/newartspace-back:sha-${{ github.sha }}
          NAS_DEPLOY_SERVICE_CONTAINER: back
          NAS_DEPLOY_DB_CONTAINER: database
          NAS_DEPLOY_LOCAL_URL: http://127.0.0.1:3000/version
          NAS_DEPLOY_SITE_URL: https://newartspace.ru/
          NAS_DEPLOY_MOUNTPOINT: /
          NAS_DEPLOY_MIN_FREE_BYTES: "10737418240"
          NAS_DEPLOY_MIN_FREE_PERCENT: "10"
          NAS_DEPLOY_MIN_FREE_INODES: "1000000"
          NAS_RETENTION_SOFT_MIN_FREE_BYTES: "16106127360"
          NAS_DEPLOY_DB_ATTEMPTS: "3"
          NAS_DEPLOY_DB_DELAY_SECONDS: "5"
          NAS_DEPLOY_SERVICE_ATTEMPTS: "10"
          NAS_DEPLOY_SERVICE_DELAY_SECONDS: "5"
          NAS_DEPLOY_REQUEST_TIMEOUT_SECONDS: "10"
          NAS_RETENTION_SEED_1: ghcr.io/vsevolod-rusinskiy/newartspace-back:sha-c5a5d1c3a0f57b1fc1c49c0dd39c503000037b7d
          NAS_RETENTION_SEED_2: ghcr.io/vsevolod-rusinskiy/newartspace-back:sha-25f399f352b311462caf53e12baa230bc1049366
          NAS_RETENTION_SEED_3: ghcr.io/vsevolod-rusinskiy/newartspace-back:sha-492304ccfad8038d047e5228e989eedb3da04f38
          NAS_BACKEND_DEPLOY_SCRIPT: /var/www/newartspace/scripts/deploy.sh
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script_path: scripts/deploy/production-release.sh
          envs: NAS_RETENTION_MODE,NAS_RELEASE_LOCK_PATH,NAS_RELEASE_LOCK_WAIT_SECONDS,NAS_RETENTION_STATE_DIR,NAS_RETENTION_OWNER_UID,NAS_RETENTION_LEDGER_NAME,NAS_IMAGE_REPOSITORY,NAS_DEPLOY_EXPECTED_IMAGE,NAS_DEPLOY_SERVICE_CONTAINER,NAS_DEPLOY_DB_CONTAINER,NAS_DEPLOY_LOCAL_URL,NAS_DEPLOY_SITE_URL,NAS_DEPLOY_MOUNTPOINT,NAS_DEPLOY_MIN_FREE_BYTES,NAS_DEPLOY_MIN_FREE_PERCENT,NAS_DEPLOY_MIN_FREE_INODES,NAS_RETENTION_SOFT_MIN_FREE_BYTES,NAS_DEPLOY_DB_ATTEMPTS,NAS_DEPLOY_DB_DELAY_SECONDS,NAS_DEPLOY_SERVICE_ATTEMPTS,NAS_DEPLOY_SERVICE_DELAY_SECONDS,NAS_DEPLOY_REQUEST_TIMEOUT_SECONDS,NAS_RETENTION_SEED_1,NAS_RETENTION_SEED_2,NAS_RETENTION_SEED_3,NAS_BACKEND_DEPLOY_SCRIPT
