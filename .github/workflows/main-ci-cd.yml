name: Master CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Security audit (non-blocking)
        run: |
          yarn audit || true

      - name: Run Prettier check
        run: yarn prettier-check

      - name: Run Lint check
        run: yarn lint

      - name: Run disk/inode preflight tests
        run: bash scripts/deploy/preflight.test.sh

      - name: Run database preflight tests
        run: bash scripts/deploy/database-preflight.test.sh

      - name: Run service readiness tests
        run: bash scripts/deploy/service-readiness.test.sh

      - name: Run Jest tests
        run: yarn test --runInBand

      - name: Build backend
        run: yarn build

  build-and-push:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/vsevolod-rusinskiy/newartspace-back:sha-${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Disk/inode preflight
        uses: appleboy/ssh-action@v1.2.5
        env:
          NAS_DEPLOY_MOUNTPOINT: /
          NAS_DEPLOY_MIN_FREE_BYTES: "10737418240"
          NAS_DEPLOY_MIN_FREE_PERCENT: "10"
          NAS_DEPLOY_MIN_FREE_INODES: "1000000"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script_path: scripts/deploy/preflight.sh
          envs: NAS_DEPLOY_MOUNTPOINT,NAS_DEPLOY_MIN_FREE_BYTES,NAS_DEPLOY_MIN_FREE_PERCENT,NAS_DEPLOY_MIN_FREE_INODES

      - name: Database preflight
        uses: appleboy/ssh-action@v1.2.5
        env:
          NAS_DEPLOY_DB_CONTAINER: database
          NAS_DEPLOY_DB_ATTEMPTS: "3"
          NAS_DEPLOY_DB_DELAY_SECONDS: "5"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script_path: scripts/deploy/database-preflight.sh
          envs: NAS_DEPLOY_DB_CONTAINER,NAS_DEPLOY_DB_ATTEMPTS,NAS_DEPLOY_DB_DELAY_SECONDS

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -e
            cd /var/www/newartspace/scripts
            ./deploy.sh back sha-${{ github.sha }}
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | sed -n '1,30p'

      - name: Post-deploy database readiness
        uses: appleboy/ssh-action@v1.2.5
        env:
          NAS_DEPLOY_DB_CONTAINER: database
          NAS_DEPLOY_DB_ATTEMPTS: "3"
          NAS_DEPLOY_DB_DELAY_SECONDS: "5"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script_path: scripts/deploy/database-preflight.sh
          envs: NAS_DEPLOY_DB_CONTAINER,NAS_DEPLOY_DB_ATTEMPTS,NAS_DEPLOY_DB_DELAY_SECONDS

      - name: Post-deploy service readiness
        uses: appleboy/ssh-action@v1.2.5
        env:
          NAS_DEPLOY_SERVICE_CONTAINER: back
          NAS_DEPLOY_EXPECTED_IMAGE: ghcr.io/vsevolod-rusinskiy/newartspace-back:sha-${{ github.sha }}
          NAS_DEPLOY_LOCAL_URL: http://127.0.0.1:3000/version
          NAS_DEPLOY_SITE_URL: https://newartspace.ru/
          NAS_DEPLOY_SERVICE_ATTEMPTS: "10"
          NAS_DEPLOY_SERVICE_DELAY_SECONDS: "5"
          NAS_DEPLOY_REQUEST_TIMEOUT_SECONDS: "10"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script_path: scripts/deploy/service-readiness.sh
          envs: NAS_DEPLOY_SERVICE_CONTAINER,NAS_DEPLOY_EXPECTED_IMAGE,NAS_DEPLOY_LOCAL_URL,NAS_DEPLOY_SITE_URL,NAS_DEPLOY_SERVICE_ATTEMPTS,NAS_DEPLOY_SERVICE_DELAY_SECONDS,NAS_DEPLOY_REQUEST_TIMEOUT_SECONDS
